[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subscription-billing-dw"
version = "1.0.0"
description = "High-performance OLAP Data Warehouse for SaaS Subscription & Billing Analytics"
authors = [
    {name = "Mohammad Javad Dianat", email = "dianatofficial9@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "faker>=24.0.0",
    "tabulate>=0.9.0",
    "python-dateutil>=2.8.2",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
